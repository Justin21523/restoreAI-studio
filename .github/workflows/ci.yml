name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: pip install -e '.[dev]'

      - name: Python quality gates
        run: |
          pytest -q
          ruff check restorai tests alembic scripts
          python -m compileall -q restorai alembic scripts
          alembic upgrade head --sql >/tmp/restorai-schema.sql

      - name: React quality gates
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run format:check
          npm test
          npm run typecheck
          VITE_APP_MODE=demo npm run build
          npm run e2e

      - name: Validate Compose configuration
        run: docker compose config --quiet
