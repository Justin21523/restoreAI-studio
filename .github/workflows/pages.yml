name: Deploy RestorAI Studio Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install smoke dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docker/requirements.demo.txt pytest

      - name: Compile Python modules
        run: python -m compileall -q api core utils scripts ui webapp

      - name: Run smoke tests
        run: |
          python -m pytest -q
          python scripts/smoke_demo.py

      - name: Build static demo
        run: python scripts/build_static_demo.py

      - name: Deploy static demo to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/restorai-pages /tmp/restorai-dist
          mkdir -p /tmp/restorai-dist
          cp -R dist/. /tmp/restorai-dist/
          git fetch origin gh-pages
          git worktree add /tmp/restorai-pages origin/gh-pages
          rm -rf /tmp/restorai-pages/*
          cp -R /tmp/restorai-dist/. /tmp/restorai-pages/
          touch /tmp/restorai-pages/.nojekyll
          cd /tmp/restorai-pages
          git add -A
          git commit -m "Deploy RestorAI Studio demo ${GITHUB_SHA}" || exit 0
          git push origin HEAD:gh-pages
